name: Redirección (GitHub Pages)

# La web real se publica en Firebase Hosting (npm run publicar). La dirección de
# GitHub Pages queda solo como redirección, para que los QR impresos con ella
# sigan funcionando: …github.io/PAGINA-QR/?c=negocio → pagina-qr-b0703.web.app/?c=negocio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/redirect
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
