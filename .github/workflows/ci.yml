name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Reglas de Firestore y recorridos completos en el navegador contra los
    # emuladores oficiales de Firebase.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
