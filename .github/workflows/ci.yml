name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reputacion
          POSTGRES_PASSWORD: reputacion
          POSTGRES_DB: reputacion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reputacion" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://reputacion:reputacion@localhost:5432/reputacion?schema=public
      TEST_DATABASE_URL: postgresql://reputacion:reputacion@localhost:5432/reputacion_test?schema=public
      E2E_DATABASE_URL: postgresql://reputacion:reputacion@localhost:5432/reputacion_e2e?schema=public
      APP_URL: http://localhost:3000
      APP_SECRET: ci-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Crear bases de prueba
        run: |
          PGPASSWORD=reputacion psql -h localhost -U reputacion -d reputacion -f scripts/sql/init-test-dbs.sql
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
