# PostgreSQL local para desarrollo (opcional si ya tenés PostgreSQL instalado).
#   docker compose up -d
#
# "postgres" es el superusuario del contenedor y solo se usa para inicializar.
# La app usa el rol "reputacion" (sin privilegios para saltear RLS), creado por
# scripts/sql/init-local.sql la primera vez que arranca el volumen.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/sql/init-local.sql:/docker-entrypoint-initdb.d/init-local.sql:ro
volumes:
  pgdata:
